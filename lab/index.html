<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>調色實驗器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: darkroom workbench — photo and scopes on the left, a Lightroom-style panel stack on the right. Same tokens as the SamAlive tutorial; scopes stay dark in both themes on purpose. */
:root{
  --bg:#15130f; --surface:#1f1b16; --sunk:#100e0b; --fg:#ede5d9; --muted:#a3988a; --line:#382f27;
  --amber:#e39a5c; --teal:#57a9aa; --good:#8fbf7a; --warn:#e0b04a; --bad:#e07a6a;
  --scope-bg:#12110f; --scope-text:#a59b8d; --on-photo:#ffffff;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eceeed; --surface:#fbfcfb; --sunk:#e1e5e3; --fg:#1c1e1d; --muted:#59605d; --line:#cdd3d0;
  --amber:#b2622a; --teal:#28797b; --good:#3f7f2c; --warn:#94690c; --bad:#b0412f; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eceeed; --surface:#fbfcfb; --sunk:#e1e5e3; --fg:#1c1e1d; --muted:#59605d; --line:#cdd3d0;
  --amber:#b2622a; --teal:#28797b; --good:#3f7f2c; --warn:#94690c; --bad:#b0412f; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.6 var(--f-body);padding-inline:16px;padding-block:0 32px}
a{color:var(--teal)}
button{font:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:500 .72rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.app{max-width:1560px;margin:0 auto}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:20px 14px;border-bottom:1px solid var(--line)}
.brand{display:grid;gap:6px}
.brand h1{font:900 1.65rem/1.15 var(--f-display);margin:0}
.brand a{text-decoration:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 .84rem var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn[aria-pressed="true"]{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.sep{width:1px;height:22px;background:var(--line)}

/* workspace */
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding-top:16px;align-items:start}
@media (max-width:980px){.work{grid-template-columns:minmax(0,1fr)}}
.stage{display:grid;gap:12px;min-width:0}
.viewbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.viewbar .tools{gap:6px}
.viewer{position:relative;background:var(--sunk);border:1px solid var(--line);padding:16px;display:grid;place-items:center;min-height:240px}
.viewer.dragover{outline:2px dashed var(--amber);outline-offset:-8px}
.cwrap{position:relative;line-height:0;max-width:100%}
#view{display:block;max-width:100%}
#view.sampling{cursor:crosshair}
.split{position:absolute;top:0;bottom:0;width:24px;margin-left:-12px;cursor:ew-resize;touch-action:none}
.split::before{content:"";position:absolute;left:11px;top:0;bottom:0;border-left:2px solid var(--on-photo);box-shadow:0 0 4px rgba(0,0,0,.6)}
.split::after{content:"";position:absolute;left:4px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--on-photo);box-shadow:0 0 4px rgba(0,0,0,.6)}
.tag-photo{position:absolute;top:8px;font:500 11px/1 var(--f-mono);color:var(--on-photo);background:rgba(0,0,0,.55);padding:4px 6px;border-radius:2px;pointer-events:none}
.pin{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border:2px solid var(--on-photo);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6);font:600 10px/16px var(--f-mono);color:var(--on-photo);text-align:center;text-shadow:0 0 3px #000;pointer-events:none}
.drop-hint{position:absolute;inset:0;display:none;place-items:center;font:500 1rem var(--f-body);color:var(--amber);background:var(--sunk);opacity:.92}
.viewer.dragover .drop-hint{display:grid}
.busy{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:500 .95rem var(--f-body);color:var(--fg);background:var(--sunk);opacity:.94}
.busy span::before{content:"";display:block;width:28px;height:28px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--amber);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fail{padding:24px;color:var(--bad);text-align:center;line-height:1.7}

.readout{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;font:.82rem var(--f-mono);color:var(--muted);min-height:26px}
.readout b{color:var(--fg);font-weight:500}
.chip{display:inline-block;width:14px;height:14px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}
.v-good{color:var(--good)} .v-warn{color:var(--warn)} .v-cool{color:var(--teal)}
.pinlist{display:grid;gap:4px}
.pinrow{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font:.8rem var(--f-mono);color:var(--muted);padding:4px 8px;border:1px solid var(--line);background:var(--surface)}
.pinrow .n{color:var(--amber)}
.pinrow button{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 4px;font-size:.9rem}

/* scopes */
.scopes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,.5fr);gap:12px}
@media (max-width:760px){.scopes{grid-template-columns:minmax(0,1fr)}.scope.vec canvas{max-width:280px}}
.scope{margin:0;background:var(--scope-bg);border:1px solid var(--line);padding:8px;display:grid;gap:6px;min-width:0;align-content:start}
.scope figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px;font:500 .72rem var(--f-mono);letter-spacing:.06em;color:var(--scope-text)}
.scope canvas{width:100%;height:auto;display:block}
.mini{display:inline-flex;gap:2px}
.mini button{font:500 .68rem var(--f-mono);background:transparent;color:var(--scope-text);border:1px solid #2e2a25;border-radius:3px;padding:1px 6px;cursor:pointer}
.mini button[aria-pressed="true"]{color:#12110f;background:var(--scope-text);border-color:var(--scope-text)}
.clip-warn{color:#e07a6a}

/* side panel */
.side{position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow-y:auto;border-left:1px solid var(--line);padding-left:20px;padding-bottom:24px}
@media (max-width:980px){.side{position:static;max-height:none;border-left:0;padding-left:0;border-top:1px solid var(--line)}}
.hint{font-size:.78rem;color:var(--muted);padding-block:10px;border-bottom:1px solid var(--line);line-height:1.7}
.hint kbd{font:.72rem var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.sec{border-bottom:1px solid var(--line)}
.sec summary{list-style:none;cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;align-items:center;font:600 1rem var(--f-display)}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:"+";font:400 1rem var(--f-mono);color:var(--muted)}
.sec[open] summary::after{content:"−"}
.sec-body{display:grid;gap:9px;padding-bottom:16px}
.grp{font:500 .68rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.sl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:center}
.sl label{font-size:.85rem;color:var(--muted);user-select:none}
.sl output{font-size:.8rem;text-align:right;min-width:3.5em}
.sl input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--track,var(--line))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--track,var(--line))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4.5px;border-radius:50%;background:var(--fg);border:0}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--fg);border:0}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:500 .8rem var(--f-body);background:transparent;color:var(--muted);border:0;padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
#curve{width:100%;max-width:300px;aspect-ratio:1;touch-action:none;cursor:crosshair;display:block;justify-self:center}
.curve-info{font:.78rem var(--f-mono);color:var(--muted);text-align:center;min-height:1.4em}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{font:.78rem var(--f-body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:3px 9px;cursor:pointer}
.quick button:hover{border-color:var(--muted)}
.quick button[aria-pressed="true"]{background:var(--amber);color:var(--bg);border-color:var(--amber)}
.wbnote{margin:0;font-size:.74rem;line-height:1.6;color:var(--muted)}
.wheels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.wheel{display:grid;gap:6px;justify-items:center;min-width:0}
.wheel canvas{width:100%;max-width:104px;aspect-ratio:1;touch-action:none;cursor:pointer}
.wheel .wl{font:600 .85rem var(--f-display)}
.wheel .wv{font:.7rem var(--f-mono);color:var(--muted);text-align:center}
.wheel .sl{width:100%}

/* presets popover */
.pop-wrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.35);padding:14px;z-index:30;display:grid;gap:10px;max-height:75vh;overflow-y:auto}
@media (max-width:640px){.pop{position:fixed;left:16px;right:16px;top:auto;bottom:16px;width:auto}}
.plist{display:grid;gap:2px}
.prow{display:flex;align-items:center;gap:4px}
.prow .pname{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--fg);padding:6px 8px;border-radius:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .pname:hover{background:var(--sunk)}
.prow .pname small{color:var(--muted);margin-left:6px}
.prow .act{background:none;border:1px solid transparent;color:var(--muted);font-size:.75rem;padding:3px 6px;border-radius:3px;cursor:pointer}
.prow .act:hover{border-color:var(--line);color:var(--fg)}
.prow .act.confirm{background:var(--bad);color:var(--bg)}
.pempty{color:var(--muted);font-size:.82rem;padding:4px 8px}
.psave{display:flex;gap:6px}
.psave input{flex:1;min-width:0;font:inherit;background:var(--sunk);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.pnote{font-size:.75rem;color:var(--muted)}
.pfoot{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:10px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:.85rem;z-index:50;max-width:calc(100vw - 32px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:60;padding:16px}
.modal-box{background:var(--surface);border:1px solid var(--line);padding:16px;display:grid;gap:12px;max-width:min(900px,100%);max-height:100%;overflow:auto}
.modal-box img{max-height:65vh;width:auto;justify-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <a class="eyebrow" href="../" target="_blank" rel="noopener">← SamAlive 調色解析</a>
      <h1>調色實驗器</h1>
    </div>
    <div class="tools">
      <button type="button" class="btn primary" id="btnOpen">開啟圖片</button>
      <div class="pop-wrap">
        <button type="button" class="btn" id="btnPresets" aria-expanded="false" aria-controls="presetPop">預設 ▾</button>
        <div class="pop" id="presetPop" hidden>
          <div class="eyebrow">內建</div>
          <div class="plist" id="builtinList"></div>
          <div class="eyebrow">我的預設</div>
          <div class="plist" id="mineList"></div>
          <form class="psave" id="saveForm">
            <input id="presetName" maxlength="40" placeholder="預設名稱，例如：咖啡廳逆光" aria-label="預設名稱">
            <button type="submit" class="btn primary">儲存</button>
          </form>
          <p class="pnote" id="storeNote"></p>
          <div class="pfoot">
            <button type="button" class="btn" id="btnImport">匯入預設檔</button>
            <button type="button" class="btn" id="btnExportCur">匯出目前設定</button>
          </div>
        </div>
      </div>
      <span class="sep"></span>
      <button type="button" class="btn" id="btnUndo" title="Ctrl+Z">復原</button>
      <button type="button" class="btn" id="btnRedo" title="Ctrl+Shift+Z">重做</button>
      <button type="button" class="btn" id="btnReset">全部重設</button>
      <span class="sep"></span>
      <button type="button" class="btn primary" id="btnExport">匯出 JPG</button>
    </div>
  </header>

  <main class="work">
    <div class="stage">
      <div class="viewbar">
        <div class="tools">
          <button type="button" class="btn" id="btnBefore" title="按住 \ 鍵也可以">按住看原圖</button>
          <button type="button" class="btn" id="btnSplit" aria-pressed="false">分割對比</button>
          <button type="button" class="btn" id="btnSampler" aria-pressed="false" title="快捷鍵 S">取樣器</button>
        </div>
        <span class="mono eyebrow" id="imgInfo"></span>
      </div>
      <div class="viewer" id="viewer">
        <div class="cwrap" id="cwrap">
          <canvas id="view" width="10" height="10" aria-label="調色預覽"></canvas>
          <div class="split" id="split" hidden></div>
          <span class="tag-photo" id="tagBefore" style="left:8px" hidden>原圖</span>
          <span class="tag-photo" id="tagAfter" style="right:8px" hidden>調整後</span>
          <div id="pins"></div>
        </div>
        <div class="drop-hint">放開以載入圖片</div>
        <div class="busy" id="busy" hidden><span></span></div>
      </div>
      <div class="readout" id="readout"></div>
      <div class="pinlist" id="pinList"></div>
      <div class="scopes">
        <figure class="scope">
          <figcaption><span>直方圖</span><span id="clipInfo"></span></figcaption>
          <canvas id="hist" width="512" height="256" aria-label="RGB 直方圖"></canvas>
        </figure>
        <figure class="scope">
          <figcaption><span>波形</span><span class="mini" id="waveMode"><button type="button" data-v="luma" aria-pressed="true">明度</button><button type="button" data-v="parade" aria-pressed="false">RGB 分量</button></span></figcaption>
          <canvas id="wave" width="512" height="256" aria-label="波形示波器"></canvas>
        </figure>
        <figure class="scope vec">
          <figcaption><span>向量</span><span class="mini" id="vecZoom"><button type="button" data-v="1" aria-pressed="true">×1</button><button type="button" data-v="2" aria-pressed="false">×2</button></span></figcaption>
          <canvas id="vec" width="256" height="256" aria-label="向量示波器"></canvas>
        </figure>
      </div>
    </div>

    <aside class="side">
      <p class="hint">雙擊滑桿名稱歸零 · <kbd>S</kbd> 取樣器 · 按住 <kbd>\</kbd> 看原圖 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 復原<br>支援 JPG、PNG、WebP 與相機 RAW（CR2、CR3、NEF、ARW、RAF、DNG 等，由 LibRaw 解碼，16 位元處理）</p>
      <details class="sec" open><summary>基本</summary><div class="sec-body" id="secBasic"></div></details>
      <details class="sec" open><summary>曲線</summary>
        <div class="sec-body">
          <div class="seg" id="curveCh" style="justify-self:start">
            <button type="button" data-v="rgb" aria-pressed="true">RGB</button><button type="button" data-v="r" aria-pressed="false">紅</button><button type="button" data-v="g" aria-pressed="false">綠</button><button type="button" data-v="b" aria-pressed="false">藍</button>
          </div>
          <canvas id="curve" width="280" height="280" aria-label="色調曲線：點擊新增控制點，拖曳調整，雙擊刪除"></canvas>
          <div class="curve-info" id="curveInfo">點擊新增控制點 · 拖曳調整 · 雙擊刪除</div>
          <div class="quick">
            <button type="button" data-curve="lift">黑色缺失</button>
            <button type="button" data-curve="both">黑白皆缺失</button>
            <button type="button" data-curve="s">輕微 S 曲線</button>
            <button type="button" data-curve="reset">重設此通道</button>
          </div>
        </div>
      </details>
      <details class="sec"><summary>混色器</summary>
        <div class="sec-body">
          <div class="seg" id="hslTab" style="justify-self:start">
            <button type="button" data-v="hue" aria-pressed="true">色相</button><button type="button" data-v="sat" aria-pressed="false">飽和度</button><button type="button" data-v="lum" aria-pressed="false">明亮度</button>
          </div>
          <div id="hslRows" style="display:grid;gap:9px"></div>
        </div>
      </details>
      <details class="sec"><summary>顏色分級</summary>
        <div class="sec-body">
          <div class="wheels" id="wheels"></div>
          <div id="gradeRows" style="display:grid;gap:9px"></div>
        </div>
      </details>
      <details class="sec"><summary>效果</summary><div class="sec-body" id="secFx"></div></details>
    </aside>
  </main>
</div>
<input type="file" id="openFile" accept="image/*,.cr2,.cr3,.crw,.nef,.nrw,.arw,.srf,.sr2,.raf,.orf,.rw2,.rwl,.dng,.pef,.srw,.x3f,.3fr,.fff,.iiq,.erf,.mos,.mrw,.kdc,.dcr,.mef" hidden>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const BANDS = [["紅",0],["橙",30],["黃",60],["綠",120],["青",180],["藍",240],["紫",270],["洋紅",300]];

/* ================= parameters ================= */
const zeros = () => [0,0,0,0,0,0,0,0];
const line = () => [[0,0],[255,255]];
const DEF = () => ({
  temp:0, tint:0, exposure:0, contrast:0, highlights:0, shadows:0, whites:0, blacks:0, vibrance:0, saturation:0,
  hue:zeros(), sat:zeros(), lum:zeros(),
  grade:{ shadows:{h:200,s:0,l:0}, midtones:{h:30,s:0,l:0}, highlights:{h:40,s:0,l:0}, blending:50, balance:0 },
  curve:{ rgb:line(), r:line(), g:line(), b:line() },
  vignette:0, grain:0
});
const get = (o,p) => p.split(".").reduce((a,k) => a[k], o);
const set = (o,p,v) => { const ks = p.split("."), last = ks.pop(); ks.reduce((a,k) => a[k], o)[last] = v; };

const bi = (label, extra) => Object.assign({label, min:-100, max:100, step:1, signed:true}, extra || {});
const SPEC = {
  temp: bi("色溫", {track:"linear-gradient(90deg,#4d7fc4,#bdbab2,#e3a04f)"}),
  tint: bi("色調", {track:"linear-gradient(90deg,#4f9e5a,#bdbab2,#c25bb0)"}),
  exposure: {label:"曝光", min:-3, max:3, step:.05, signed:true, dec:2},
  contrast: bi("對比"), highlights: bi("高光"), shadows: bi("陰影"), whites: bi("白色"), blacks: bi("黑色"),
  vibrance: bi("自然飽和度"), saturation: bi("飽和度"),
  vignette: bi("暈影"), grain: {label:"顆粒", min:0, max:100, step:1},
  "grade.blending": {label:"混合", min:0, max:100, step:1}, "grade.balance": bi("平衡")
};
["shadows","midtones","highlights"].forEach(r => {
  SPEC[`grade.${r}.l`] = bi("明亮度");

function normalize(src){
  const out = DEF();
  if (!src || typeof src !== "object") return out;
  for (const p in SPEC){
    let v; try { v = get(src, p); } catch(e) { continue; }
    if (typeof v === "number" && isFinite(v)) set(out, p, clamp(v, SPEC[p].min, SPEC[p].max));
  }
  if (src.curve && typeof src.curve === "object") for (const ch of ["rgb","r","g","b"]){
    const c = src.curve[ch];
    if (Array.isArray(c) && c.length >= 2 && c.length <= 16 && c.every(q => Array.isArray(q) && q.length === 2 && q.every(n => typeof n === "number" && isFinite(n)))){
      const pts = c.map(q => [clamp(Math.round(q[0]),0,255), clamp(Math.round(q[1]),0,255)]).sort((a,b) => a[0]-b[0]);
      const uniq = pts.filter((q,i) => i === 0 || q[0] !== pts[i-1][0]);
      if (uniq.length >= 2) out.curve[ch] = uniq;
    }
  }
  return out;
}

function curveFn(pts){
  const n = pts.length, xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  if (n === 2) return x => x <= xs[0] ? ys[0] : x >= xs[1] ? ys[1] : ys[0] + (ys[1]-ys[0])*(x-xs[0])/(xs[1]-xs[0]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n-1; i++) d.push((ys[i+1]-ys[i])/(xs[i+1]-xs[i]));
  m[0] = d[0]; m[n-1] = d[n-2];
  for (let i = 1; i < n-1; i++) m[i] = d[i-1]*d[i] <= 0 ? 0 : (d[i-1]+d[i])/2;
  for (let i = 0; i < n-1; i++){
    if (d[i] === 0){ m[i] = 0; m[i+1] = 0; continue; }
    const a = m[i]/d[i], b = m[i+1]/d[i], s = a*a+b*b;
    if (s > 9){ const t = 3/Math.sqrt(s); m[i] = t*a*d[i]; m[i+1] = t*b*d[i]; }
  }
  return x => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n-1]) return ys[n-1];
    let i = 0; while (x > xs[i+1]) i++;
    const h = xs[i+1]-xs[i], t = (x-xs[i])/h, t2 = t*t, t3 = t2*t;
    return (2*t3-3*t2+1)*ys[i] + (t3-2*t2+t)*h*m[i] + (-2*t3+3*t2)*ys[i+1] + (t3-t2)*h*m[i+1];
  };
}

    const bytes = new Uint8Array(await file.arrayBuffer());
    await rawCall("open", [bytes, {outputBps: 16, outputColor: 1, useCameraWb: true, userQual: 3}], [bytes.buffer]);
    const meta = await rawCall("metadata", [false]).catch(() => null);
    let out = null;
    try { out = await rawCall("imageData", []); } catch(e){ out = null; }
    if (out && out.data && out.width){
      const shrunk = setRawImage(out, base, meta);
      toast(shrunk ? "RAW 已載入（超過顯示卡上限，已縮小一半）" : "RAW 已載入，以 16 位元處理");
      return;
    }
    const th = await rawCall("thumbnailData", []).catch(() => null);
    if (th && th.data && th.data[0] === 0xFF && th.data[1] === 0xD8){
      await loadBlob(new Blob([th.data], {type: "image/jpeg"}), base);
      toast("這個 RAW 無法完整解碼，改用相機內嵌的預覽 JPEG（8 位元）");
      return;
    }
    throw new Error("decode failed");
  } catch(e){
    toast(/load/.test(e && e.message) ? "無法載入 RAW 解碼器，請確認 vendor/libraw 檔案已部署" : "無法讀取這個 RAW 檔，可能是不支援的機型或檔案損毀");
  } finally {
    setBusy(""); rawStop();
  }
}

/* 8-bit rounding after an adjustment leaves comb gaps (empty bins next to doubled ones).

function smoothBins(a){
  const o = new Float32Array(256), w = [1,2,3,2,1];
  for (let k = 0; k < 256; k++){
    let s = 0, ws = 0;
    for (let j = -2; j <= 2; j++){ const i = k + j; if (i >= 0 && i < 256){ s += a[i]*w[j+2]; ws += w[j+2]; } }
    o[k] = s/ws;
  }
  return o;
}
function robustMax(arrs){
  const vals = [];
  arrs.forEach(a => { for (let k = 3; k < 253; k++) vals.push(a[k]); });
  vals.sort((x, y) => x - y);
  return Math.max(1, vals[Math.floor(vals.length*.99)]);
}
function drawHist(n){
  const cv = $("#hist"), ctx = cv.getContext("2d"), W = cv.width, H = cv.height, px = scopeBuf;
  const R = new Uint32Array(256), G = new Uint32Array(256), B = new Uint32Array(256);
  let lo = 0, hi = 0;
  for (let i = 0; i < n*4; i += 4){
    const r = px[i], g = px[i+1], b = px[i+2];
    R[r]++; G[g]++; B[b]++;
    if (r <= 2 && g <= 2 && b <= 2) lo++;
    if (r >= 253 || g >= 253 || b >= 253) hi++;
  }
  const sR = smoothBins(R), sG = smoothBins(G), sB = smoothBins(B);
  histBins = {r: sR, g: sG, b: sB};
  const mx = robustMax([sR, sG, sB]);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = `rgb(${SC_BG})`; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(255,255,255,.07)"; ctx.lineWidth = 1;
  for (let q = 1; q < 4; q++){ ctx.beginPath(); ctx.moveTo(q*W/4+.5, 0); ctx.lineTo(q*W/4+.5, H); ctx.stroke(); }
  ctx.globalCompositeOperation = "lighter";
  [[sR,"rgba(225,70,60,.85)"],[sG,"rgba(70,190,90,.85)"],[sB,"rgba(70,120,235,.9)"]].forEach(([a,col]) => {
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let k = 0; k < 256; k++) ctx.lineTo(k*W/255, H - Math.min(1, a[k]/mx)*(H-10));
    ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  });
  ctx.globalCompositeOperation = "source-over";
  const pct = v => (v/n*100).toFixed(1) + "%";
  const lw = lo/n > .005, hw = hi/n > .005;
  $("#clipInfo").innerHTML = `<span class="${lw ? "clip-warn" : ""}">暗部裁切 ${pct(lo)}</span> · <span class="${hw ? "clip-warn" : ""}">亮部裁切 ${pct(hi)}</span>`;
}
function drawWave(w, h){

  const c0 = new Int32Array(w), c1 = new Int32Array(w);
  for (let x = 0; x < w; x++){ c0[x] = Math.floor(x*secW/w); c1[x] = Math.max(c0[x]+1, Math.floor((x+1)*secW/w)); }
  const acc = []; for (let q = 0; q < nch; q++) acc.push(new Uint32Array(W*H));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const i = (y*w+x)*4, a = c0[x], b = c1[x];

    d[j*4] = r; d[j*4+1] = g; d[j*4+2] = b; d[j*4+3] = 255;
  }

  ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.font = '11px "IBM Plex Mono", monospace'; ctx.lineWidth = 1;

const VEC_TARGETS = [["R",[.75,0,0]],["MG",[.75,0,.75]],["B",[0,0,.75]],["CY",[0,.75,.75]],["G",[0,.75,0]],["YL",[.75,.75,0]]];
const cbcr = (r,g,b) => [-.168736*r - .331264*g + .5*b, .5*r - .418688*g - .081312*b];
function drawVec(n){
  const cv = $("#vec"), ctx = cv.getContext("2d"), S = cv.width, c = S/2, R = S/2 - 10, z = vecZoom*R*2, px = scopeBuf;
  const cnt = new Uint32Array(S*S), sr = new Float32Array(S*S), sg = new Float32Array(S*S), sb = new Float32Array(S*S);
  for (let i = 0; i < n*4; i += 4){
    const r = px[i], g = px[i+1], b = px[i+2], [cb, cr] = cbcr(r/255, g/255, b/255);
    const x = Math.round(c + cb*z), y = Math.round(c - cr*z);
    if (x < 0 || y < 0 || x >= S || y >= S) continue;
    const j = y*S + x; cnt[j]++; sr[j] += r; sg[j] += g; sb[j] += b;
  }
  const k = 1500/n, id = ctx.createImageData(S, S), d = id.data;
  for (let j = 0; j < S*S; j++){
    let r = SC_BG[0], g = SC_BG[1], b = SC_BG[2];
    if (cnt[j]){
      const v = Math.max(.2, 1-Math.exp(-cnt[j]*k)), ar = sr[j]/cnt[j], ag = sg[j]/cnt[j], ab = sb[j]/cnt[j], m = Math.max(ar, ag, ab, 1);
      r = ar/m*255*v; g = ag/m*255*v; b = ab/m*255*v;
    }
    d[j*4] = r; d[j*4+1] = g; d[j*4+2] = b; d[j*4+3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.18)";
  ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(c-R, c); ctx.lineTo(c+R, c); ctx.moveTo(c, c-R); ctx.lineTo(c, c+R); ctx.stroke();
  ctx.font = '10px "IBM Plex Mono", monospace'; ctx.fillStyle = "rgba(255,255,255,.5)";
  VEC_TARGETS.forEach(([name, rgb]) => {
    const [cb, cr] = cbcr(...rgb), x = c + cb*z, y = c - cr*z;
    if (Math.hypot(x-c, y-c) > R + 4) return;

  ctx.beginPath(); ctx.moveTo(c, c); ctx.lineTo(c + sb0/len*R, c - sc0/len*R); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "rgba(227,154,92,.9)"; ctx.fillText("膚色線", c + sb0/len*R*.55 - 34, c - sc0/len*R*.55);
}

const ccv = $("#curve"), cctx = ccv.getContext("2d"), PAD = 12;

const CURVE_COL = {r:"#e0574b", g:"#5bb46a", b:"#5a8ee6"};

function toC(x, y){ return [PAD + x, PAD + 255 - y]; }

  const W = ccv.width, ctx = cctx;

    const sum = new Float32Array(256); arrs.forEach(a => { for (let k = 0; k < 256; k++) sum[k] += a[k]; });
    const mx = robustMax([sum]);

    for (let k = 0; k < 256; k++) ctx.lineTo(PAD + k, PAD + 256 - Math.min(1, sum[k]/mx)*200);
    ctx.lineTo(PAD+256, PAD+256); ctx.closePath();

  }
  ctx.strokeStyle = cssv("--line"); ctx.lineWidth = 1;
  for (let q = 1; q < 4; q++){ const p = PAD + q*64 + .5; ctx.beginPath(); ctx.moveTo(p, PAD); ctx.lineTo(p, PAD+256); ctx.moveTo(PAD, p); ctx.lineTo(PAD+256, p); ctx.stroke(); }

  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();

}
function nearPoint(cx, cy){ const pts = P.curve[cch]; for (let i = 0; i < pts.length; i++){ const [px, py] = toC(pts[i][0], pts[i][1]); if (Math.hypot(px-cx, py-cy) < 10) return i; } return -1; }

/* ================= white balance: eyedropper & gray world ================= */
/* The shader applies WB in linear light as r×(1+.3t), g×(1−.25u), b×(1−.3t).
   Given a linear RGB that should be neutral, solve t and u so the three channels come out equal. */
let wbPicking = false;
function setWbPick(on){
  wbPicking = on;
  if (on && sampling){ sampling = false; $("#btnSampler").setAttribute("aria-pressed", "false"); }
  $("#btnWbPick").setAttribute("aria-pressed", String(on));
  view.classList.toggle("sampling", on || sampling);
  if (on) toast("點畫面中應該是白色或灰色的地方（Esc 取消）");
}
$("#btnWbPick").addEventListener("click", () => setWbPick(!wbPicking));

const toLin = v => { v /= 255; return v <= .04045 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); };
function solveWB(R, G, B){
  const t = (B - R)/(.3*(R + B));
  const k = (1 + .3*t)*R;
  const u = (1 - k/G)/.25;
  return [Math.round(t*100), Math.round(u*100)];
}
function applyWB(t, u, label){
  const ct = clamp(t, -100, 100), cu = clamp(u, -100, 100);
  P.temp = ct; P.tint = cu; syncRow("temp"); syncRow("tint"); requestRender(); pushHistory();
  const out = ct !== t || cu !== u;
  toast(`${label}：色溫 ${ct > 0 ? "+" : ""}${ct}、色調 ${cu > 0 ? "+" : ""}${cu}` + (out ? "（偏色超出滑桿範圍，已校正到上限）" : ""));
}
function wbFromPoint(u, v){
  const r = Math.max(1, Math.round(2*img.w/view.clientWidth));
  const cx = clamp(Math.round(u*img.w), 0, img.w-1), cy = clamp(Math.round(v*img.h), 0, img.h-1);
  const x0 = Math.max(0, cx-r), y0 = Math.max(0, cy-r), w = Math.min(img.w, cx+r+1) - x0, h = Math.min(img.h, cy+r+1) - y0;
  const d = readRegion(x0, y0, w, h);
  let R = 0, G = 0, B = 0, n = 0, clipped = false;
  for (let i = 0; i < d.length; i += 4){
    if (d[i] >= 254 || d[i+1] >= 254 || d[i+2] >= 254) clipped = true;
    R += toLin(d[i]); G += toLin(d[i+1]); B += toLin(d[i+2]); n++;
  }
  setWbPick(false);
  if (clipped){ toast("這一點已經過曝，無法判斷顏色，請改點沒有爆白的灰或白"); return; }
  if (Math.max(R, G, B)/n < .004){ toast("這一點太暗，請改點亮一些的灰或白"); return; }
  const [t, ti] = solveWB(R/n, G/n, B/n);
  applyWB(t, ti, "白平衡吸管");
}
$("#btnWbAuto").addEventListener("click", () => {

  for (let i = 0; i < d.length; i += 4){
    const r = toLin(d[i]), g = toLin(d[i+1]), b = toLin(d[i+2]);
    R2 += r; G2 += g; B2 += b;
    if (Math.max(d[i], d[i+1], d[i+2]) >= 250 || Math.max(d[i], d[i+1], d[i+2]) < 8) continue;
    R += r; G += g; B += b; n++;
  }
  if (n < d.length/40){ R = R2; G = G2; B = B2; }
  if (Math.min(R, G, B) <= 0){ toast("畫面缺少某個顏色通道，無法用灰色世界估算"); return; }

new MutationObserver(redrawThemed).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

store.loadLocal();
renderPresetLists();
syncUI(); pushHistory();
setImage(sampleImage(), "範例色卡");
toast("目前是範例色卡，按「開啟圖片」或把照片、RAW 檔拖進來開始調色");

(async () => {
  if (!window.claude || typeof window.claude.use !== "function") return;
  const [db, dl] = await Promise.all([
    claude.use("db").catch(() => null),
    claude.use("downloads").catch(() => null)
  ]);
  downloads = dl;
  if (db){
    store.mode = "db"; store.db = db; store.list = []; renderPresetLists();
    db.collection("presets").onSnapshot(snap => {
      store.list = snap.docs.map(d => Object.assign({id: d.id}, d.data()))
        .filter(p => typeof p.name === "string" && p.params && typeof p.params === "object")
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      renderPresetLists();
    }, () => {});
  }
})();
})();
</script>
